name: rhoai-ai-feature-sizing

control-plane:
  port: 4501

default-service: rfe-investigation-workflow

services:
  rfe-investigation-workflow:
    name: RFE Investigation Workflow
    source:
      type: local
      name: src
    path: src/rfe_investigation_workflow:rfe_investigation_workflow
    python-dependencies:
      - llama-index-llms-openai>=0.3.2
      - llama-index-core>=0.12.0
      - pyyaml>=6.0
  artifact-generation-workflow:
    name: Artifact Generation Workflow
    source:
      type: local
      name: src
    path: src/artifact_generation_workflow:artifact_generation_workflow
    python-dependencies:
      - llama-index-llms-openai>=0.3.2
      - llama-index-core>=0.12.0
      - pyyaml>=6.0
  artifact-editor-workflow:
    name: Artifact Editor Workflow
    source:
      type: local
      name: src
    path: src/artifact_editor_workflow:artifact_editor_workflow
    python-dependencies:
      - llama-index-llms-openai>=0.3.2
      - llama-index-core>=0.12.0
      - pyyaml>=6.0


ui:
  name: Chat UI
  port: 3000
  source:
    type: local
    name: ui